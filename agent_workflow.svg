<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><style>text{font-family:Microsoft YaHei,sans-serif;fill:#17324d}.box{fill:#edf4fc;stroke:#cbdcf1}.human{fill:#fff4db;stroke:#e7b75c}</style><rect width="1200" height="330" fill="white"/><text x="35" y="47" font-size="25">研迹 ResearchTrace：七步研究工作流</text><text x="35" y="80" font-size="14">三种独立方式：离线 Mock / 本地资料＋真实模型 / 联网研究 Agent</text><rect x="35" y="118" width="145" height="78" rx="8" class="box"/><text x="49" y="147" font-size="14">01</text><text x="49" y="177" font-size="19">任务拆解</text><text x="185" y="164" font-size="20">→</text><rect x="201" y="118" width="145" height="78" rx="8" class="box"/><text x="215" y="147" font-size="14">02</text><text x="215" y="177" font-size="19">资料检索</text><text x="351" y="164" font-size="20">→</text><rect x="367" y="118" width="145" height="78" rx="8" class="box"/><text x="381" y="147" font-size="14">03</text><text x="381" y="177" font-size="19">数据提取</text><text x="517" y="164" font-size="20">→</text><rect x="533" y="118" width="145" height="78" rx="8" class="box"/><text x="547" y="147" font-size="14">04</text><text x="547" y="177" font-size="19">口径核验</text><text x="683" y="164" font-size="20">→</text><rect x="699" y="118" width="145" height="78" rx="8" class="human"/><text x="713" y="147" font-size="14">05</text><text x="713" y="177" font-size="19">人工审核</text><text x="849" y="164" font-size="20">→</text><rect x="865" y="118" width="145" height="78" rx="8" class="box"/><text x="879" y="147" font-size="14">06</text><text x="879" y="177" font-size="19">报告生成</text><text x="1015" y="164" font-size="20">→</text><rect x="1031" y="118" width="145" height="78" rx="8" class="box"/><text x="1045" y="147" font-size="14">07</text><text x="1045" y="177" font-size="19">引用检查</text><text x="35" y="240" font-size="16">候选采用 / 排除 → 检查写作依据 → 报告草稿</text><text x="35" y="274" font-size="16">真实模型分析须再次确认后交付；本地规则报告按事实审核与依据门槛发布。</text><text x="35" y="306" font-size="14">状态、来源、调用与审核可查看；Markdown / PDF 来自同一份已确认结果。</text></svg>